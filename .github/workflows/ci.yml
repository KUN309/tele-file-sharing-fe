name: CI

on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev]

jobs:
    build:
        runs-on: [ubuntu-latest]
        steps:
          - name: Checkout
            uses: actions/checkout@v4
        
          - name: Setup Go
            uses: actions/setup-go@v4
            with:
                go-version-file: 'go.mod'
        
          - name: Download Dependencies
            run: go mod download
    
          - name: Build
            run: go build -o build/bot ./cmd/bot
